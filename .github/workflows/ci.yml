name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Lint Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version-file: .golangci-lint-version

  verify:
    name: Test and build macOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Install documentation site dependencies
        working-directory: site
        run: npm ci

      - name: Check and build documentation site
        working-directory: site
        run: |
          npm run check
          npm run build

      - name: Test Go packages
        run: go test ./...

      - name: Test release scripts
        run: |
          scripts/release/test_release.sh
          node scripts/release/test_semver.mjs

      - name: Verify third-party notices
        run: |
          build/darwin/updater/fetch_sparkle.sh
          node scripts/release/generate_third_party_notices.mjs --check

      - name: Build ReviewArc
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build
