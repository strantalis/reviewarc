name: Release macOS

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to control
        required: true
        type: choice
        options:
          - beta
          - stable
      action:
        description: Pause or resume updates from this channel
        required: true
        type: choice
        options:
          - pause
          - resume
      reason:
        description: Operator-visible reason recorded in channel policy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and notarize DMG
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    env:
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_COPYRIGHT: ${{ vars.APPLE_COPYRIGHT }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Apple release configuration
        shell: bash
        run: scripts/release/validate_environment.sh apple

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Test Go packages
        run: go test ./...

      - name: Test release scripts
        run: |
          scripts/release/test_release.sh
          node scripts/release/test_semver.mjs

      - name: Derive release metadata
        id: metadata
        shell: bash
        run: scripts/release/derive_metadata.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/release/import_certificate.sh

      - name: Fetch pinned Sparkle distribution
        shell: bash
        run: scripts/release/fetch_sparkle.sh dist/sparkle

      - name: Build universal macOS app
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/dist/sparkle
        run: >-
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build
          -clean -trimpath -platform darwin/universal
          -tags sparkle
          -ldflags "-X reviewarc/internal/buildinfo.Version=${{ steps.metadata.outputs.release_version }}
          -X reviewarc/internal/buildinfo.BuildNumber=${{ steps.metadata.outputs.build_number }}
          -X reviewarc/internal/buildinfo.Channel=${{ steps.metadata.outputs.channel }}"

      - name: Embed Sparkle framework
        shell: bash
        run: build/darwin/updater/embed_sparkle.sh build/bin/ReviewArc.app dist/sparkle/Sparkle.framework

      - name: Apply release metadata and sign app
        shell: bash
        run: |
          scripts/release/prepare_app.sh \
            build/bin/ReviewArc.app \
            "$APPLE_BUNDLE_ID" \
            "${{ steps.metadata.outputs.marketing_version }}" \
            "${{ steps.metadata.outputs.build_number }}" \
            "$APPLE_COPYRIGHT" \
            "$SPARKLE_PUBLIC_ED_KEY" \
            "$SPARKLE_FEED_URL"
          build/darwin/updater/sign_sparkle.sh \
            build/bin/ReviewArc.app "$APPLE_SIGNING_IDENTITY"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" build/bin/ReviewArc.app
          scripts/release/verify_app.sh \
            build/bin/ReviewArc.app "$APPLE_BUNDLE_ID" "$APPLE_TEAM_ID"
          build/darwin/updater/verify_sparkle.sh build/bin/ReviewArc.app

      - name: Create and sign DMG
        id: package
        shell: bash
        run: |
          DMG="dist/ReviewArc-${{ steps.metadata.outputs.release_version }}-macOS-universal.dmg"
          scripts/release/create_dmg.sh build/bin/ReviewArc.app "$DMG"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize and verify delivered DMG
        id: notarize
        shell: bash
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/release/notarize_dmg.sh "${{ steps.package.outputs.dmg }}"

      - name: Generate SPDX SBOM from signed app
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/bin/ReviewArc.app
          format: spdx-json
          output-file: dist/ReviewArc-${{ steps.metadata.outputs.release_version }}-macOS-universal.spdx.json
          artifact-name: ReviewArc-${{ steps.metadata.outputs.release_version }}-macOS-universal.spdx.json
          syft-version: v1.46.0
          upload-artifact: false
          upload-release-assets: false

      - name: Bind and verify release SBOM
        shell: bash
        run: |
          SBOM="dist/ReviewArc-${{ steps.metadata.outputs.release_version }}-macOS-universal.spdx.json"
          node scripts/release/augment_sbom.mjs \
            "$SBOM" \
            "${{ steps.metadata.outputs.release_version }}" \
            "${{ steps.package.outputs.dmg }}"
          scripts/release/verify_sbom.sh "$SBOM" "${{ steps.package.outputs.dmg }}"
          shasum -a 256 "$SBOM" > "$SBOM.sha256"

      - name: Sign exact notarized DMG for Sparkle
        id: sparkle-signature
        shell: bash
        env:
          SPARKLE_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY_BASE64 }}
        run: scripts/release/sign_sparkle_update.sh "${{ steps.package.outputs.dmg }}" dist/sparkle

      - name: Build release manifest
        shell: bash
        run: |
          scripts/release/create_manifest.sh \
            "${{ steps.package.outputs.dmg }}" \
            build/bin/ReviewArc.app \
            "${{ steps.metadata.outputs.release_version }}" \
            "${{ steps.metadata.outputs.marketing_version }}" \
            "${{ steps.metadata.outputs.build_number }}" \
            "${{ steps.notarize.outputs.submission_id }}" \
            "$APPLE_TEAM_ID" \
            "${{ steps.sparkle-signature.outputs.ed_signature }}"

      - name: Preserve notarized release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/*.spdx.json
            dist/notary-result.json
            dist/release.json
          if-no-files-found: error
          retention-days: 90

      - name: Clean signing material
        if: always()
        shell: bash
        run: scripts/release/cleanup_signing.sh

  publish:
    name: Publish notarized release
    needs: build
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json

      - name: Install release dependencies
        working-directory: scripts/release
        run: npm ci

      - name: Download notarized release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist

      - name: Resolve release candidate
        id: candidate
        shell: bash
        run: |
          DMG="$(find dist -maxdepth 1 -type f -name '*.dmg' -print)"
          if [[ -z "$DMG" || "$(printf '%s\n' "$DMG" | wc -l | tr -d ' ')" != 1 ]]; then
            echo "::error::Expected exactly one notarized DMG in the release candidate."
            exit 1
          fi
          shasum -a 256 -c "$DMG.sha256"
          SBOM="$(find dist -maxdepth 1 -type f -name '*.spdx.json' -print)"
          if [[ -z "$SBOM" || "$(printf '%s\n' "$SBOM" | wc -l | tr -d ' ')" != 1 ]]; then
            echo "::error::Expected exactly one SPDX SBOM in the release candidate."
            exit 1
          fi
          shasum -a 256 -c "$SBOM.sha256"
          scripts/release/verify_sbom.sh "$SBOM" "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sbom=$SBOM" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release to Vercel Blob
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/release/publish_blob.mjs "${{ steps.candidate.outputs.dmg }}" dist/release.json

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/publish_github_release.sh
          "${{ steps.candidate.outputs.dmg }}"
          "${{ steps.candidate.outputs.sbom }}"

      - name: Promote latest release manifest
        shell: bash
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/release/promote_blob.mjs dist/release.json

  channel-control:
    name: Pause or resume update channel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json

      - name: Install release dependencies
        working-directory: scripts/release
        run: npm ci

      - name: Validate channel policy logic
        run: node scripts/release/test_channel_policy.mjs

      - name: Apply channel policy
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_ACTION: ${{ inputs.action }}
          CHANNEL_REASON: ${{ inputs.reason }}
        run: node scripts/release/set_channel_policy.mjs "$CHANNEL" "$CHANNEL_ACTION" "$CHANNEL_REASON"
